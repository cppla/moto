name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting
        run: make fmt-check
      - name: Validate workflows
        run: make workflow-check
      - name: Check release packaging
        run: make release-check
      - name: Verify modules
        run: make mod-check
      - name: Test
        run: make test
      - name: Vet
        run: make vet
      - name: Static analysis
        run: make staticcheck
      - name: Test with race detector
        run: make race
      - name: Stress routing, reload, and fault transitions
        run: make fault-test
      - name: Check reachable vulnerabilities
        run: make vuln
      - name: Validate sample config
        run: make config-check
      - name: Check container context and final image
        run: make container-image-check
      - name: Check benchmark script syntax
        run: make bench-check
      - name: Run loopback-only benchmark smoke
        run: make bench-smoke

  routing-regression:
    name: Routing regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
          cache-dependency-path: go.sum
      - name: Validate the regression gate
        run: python3 -B test/routing_regression_test.py
      - name: Verify Boost, cache, health, and recovery regressions
        run: make routing-regression
        env:
          REGRESSION_SEED: ${{ github.run_id }}
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-regression-${{ matrix.os }}
          path: bin/routing-regression/
          if-no-files-found: error
          retention-days: 14

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
          cache-dependency-path: go.sum
      - run: go build -trimpath -buildvcs=false ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
